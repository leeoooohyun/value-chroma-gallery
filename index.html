<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>명도·채도 변화 감상 갤러리</title>
<script>
  // ▼ Apps Script 웹 앱 URL(…/exec로 끝나는 주소)을 따옴표 안에 붙여 넣으세요.
  const API_URL = 'https://script.google.com/macros/s/AKfycbzo96vOtEdos5A9XoDgC3oYOypivoHkzKjCJmEuGxTrfickHKwF68VcwWRcGTtiKSy5sA/exec';
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --wall:#e9eaed;
    --paper:#ffffff;
    --ink:#1c1c1f;
    --muted:#62646b;
    --line:#d3d5da;
    --cobalt:#1747e6;
    --heart:#e8204f;
    --display:'Do Hyeon', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    --body:'Gowun Dodum', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--wall);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}
  body.noscroll{overflow:hidden}
  button,input,select,textarea{font:inherit;color:inherit}
  :focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
  [hidden]{display:none!important}

  /* ---------- 상단 ---------- */
  .masthead{display:grid;grid-template-columns:1fr minmax(0,620px) 1fr;align-items:center;gap:24px;
    padding:36px 24px 20px;max-width:1240px;margin:0 auto}
  .scale{display:flex;flex-direction:column;gap:6px;align-items:center}
  .chips{display:flex;gap:4px}
  .chips i{display:block;width:22px;height:46px;border-radius:3px}
  .scale small{font-size:13px;color:var(--muted)}
  .title-wrap{text-align:center}
  h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,5vw,46px);line-height:1.15;margin:0 0 8px;letter-spacing:-.5px}
  .title-wrap p{margin:0;color:var(--muted);font-size:15px}

  .toolbar{max-width:1240px;margin:0 auto;padding:12px 24px 18px;display:flex;flex-wrap:wrap;gap:12px;
    align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
  .me{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--paper);padding:8px 10px;border-radius:10px;border:1px solid var(--line)}
  .me label{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
  .me input{width:92px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fafafb;color:var(--ink)}
  .me .status{font-size:14px;color:var(--cobalt);padding:0 4px}
  .actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .actions input,.actions select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
  .actions input{width:170px}
  .btn{border:1px solid var(--line);background:var(--paper);padding:8px 14px;border-radius:8px;cursor:pointer}
  .btn:hover{border-color:#9ea1a8}
  .btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  .btn.primary:hover{background:#000}
  .btn.danger{color:#b3122f;border-color:#efb7c3}
  .btn.on{background:#fff4c2;border-color:#e2c44a}
  .btn:disabled{opacity:.5;cursor:default}

  /* ---------- 갤러리 ---------- */
  main{max-width:1240px;margin:0 auto;padding:20px 24px 60px}
  .count{font-size:14px;color:var(--muted);margin:0 0 14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px}
  .card{background:var(--paper);border-radius:4px;padding:12px 12px 10px;cursor:pointer;border:1px solid transparent}
  .card:hover{border-color:#b9bcc3}
  .trip{display:grid;grid-template-columns:1fr 1.45fr 1fr;gap:6px;height:170px;align-items:stretch}
  .trip .t{background:#f1f2f4;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .trip img{width:100%;height:100%;object-fit:cover;display:block}
  .trip .side{transform:scale(.9)}
  .meta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px}
  .meta h3{font-family:var(--display);font-weight:400;font-size:20px;line-height:1.2;margin:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .meta p{margin:0;font-size:14px;color:var(--muted)}
  .meta > div{min-width:0}
  .heart{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--paper);
    border-radius:999px;padding:5px 12px 5px 10px;cursor:pointer;font-size:15px;flex:none}
  .heart svg{width:18px;height:18px;fill:none;stroke:var(--heart);stroke-width:2}
  .heart.liked{border-color:#f4a3b6;background:#fff0f3}
  .heart.liked svg{fill:var(--heart)}
  .heart.pop svg{animation:pop .35s ease}
  @keyframes pop{50%{transform:scale(1.35)}}
  .heart.big{font-size:17px;padding:8px 18px 8px 14px}
  .heart.big svg{width:22px;height:22px}

  .empty{text-align:center;padding:70px 20px;color:var(--muted)}
  .empty strong{display:block;font-family:var(--display);font-weight:400;font-size:24px;color:var(--ink);margin-bottom:6px}

  /* ---------- 모달 ---------- */
  .modal{position:fixed;inset:0;background:rgba(20,20,24,.62);display:flex;align-items:flex-start;justify-content:center;
    padding:30px 16px;overflow-y:auto;z-index:20}
  .sheet{background:var(--paper);border-radius:12px;width:100%;max-width:1100px;padding:26px 26px 22px;position:relative}
  .sheet > header h2{font-family:var(--display);font-weight:400;font-size:30px;margin:0;line-height:1.2;padding-right:44px}
  .sheet > header p{margin:4px 0 0;color:var(--muted)}
  .close{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);
    background:var(--paper);cursor:pointer;font-size:20px;line-height:1}
  .sheet > footer{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:22px;flex-wrap:wrap}

  /* 세 작품 나란히: 왼쪽 명도, 가운데 원작품, 오른쪽 채도 */
  .tri{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:20px;margin-top:20px;align-items:start}
  .panel{margin:0;display:flex;flex-direction:column;gap:8px}
  .panel figcaption{font-family:var(--display);font-size:19px;display:flex;align-items:center;gap:8px}
  .panel figcaption i{display:inline-block;width:42px;height:10px;border-radius:2px}
  .value figcaption i{background:linear-gradient(90deg,#151515,#f2f2f2)}
  .chroma figcaption i{background:linear-gradient(90deg,#8d8f96,var(--cobalt))}
  .orig figcaption i{background:var(--ink);width:10px}
  .hint{font-size:13px;color:var(--muted)}

  .flip{perspective:1400px;cursor:pointer}
  .flip.static{cursor:default}
  .flip-inner{position:relative;transition:transform .55s ease;transform-style:preserve-3d}
  .flip.flipped .flip-inner{transform:rotateY(180deg)}
  .face{backface-visibility:hidden;-webkit-backface-visibility:hidden}
  .front{background:#f1f2f4;min-height:220px;display:flex;align-items:center;justify-content:center}
  .front img{width:100%;max-height:62vh;object-fit:contain;display:block}
  .back{position:absolute;inset:0;transform:rotateY(180deg);padding:22px;overflow:auto;display:flex;flex-direction:column;justify-content:center}
  .value .back{background:linear-gradient(160deg,#1d1d1f,#4a4a4d);color:#fff}
  .chroma .back{background:linear-gradient(160deg,#0f2fa8,var(--cobalt));color:#fff}
  .orig .back{background:#f4f4f6;color:var(--ink)}
  .back h4{font-family:var(--display);font-weight:400;font-size:21px;margin:0 0 10px;line-height:1.25}
  .back p{margin:0;font-size:17px;line-height:1.75;white-space:pre-wrap;word-break:keep-all}

  /* ---------- 업로드 ---------- */
  .who-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px}
  .field{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
  .field input,.field textarea{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:#fafafb;color:var(--ink);font-size:16px}
  .field.grow{flex:1;min-width:200px}
  .field textarea{min-height:110px;resize:vertical;line-height:1.6}
  .slot{display:flex;flex-direction:column;gap:10px}
  .drop{position:relative;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;
    min-height:220px;border:2px dashed #b9bcc3;border-radius:6px;background:#f6f7f9;cursor:pointer;overflow:hidden;text-align:center;padding:10px}
  .drop:hover,.drop.over{border-color:var(--cobalt);background:#eef2ff}
  .drop input{position:absolute;width:1px;height:1px;opacity:0}
  .drop:focus-within{outline:3px solid var(--cobalt);outline-offset:2px}
  .drop img{max-width:100%;max-height:280px;display:block}
  .drop .ph{color:var(--muted);font-size:15px}
  .drop .ph b{display:block;color:var(--ink);font-weight:400;font-family:var(--display);font-size:18px}
  .drop.filled{border-style:solid;background:#fff;padding:6px}
  .drop.filled .ph{display:none}
  .maker{border:1px solid var(--line);border-radius:6px;padding:10px}
  .maker > button{width:100%}
  .maker-panel{margin-top:10px;display:flex;flex-direction:column;gap:6px}
  .maker-panel input[type=range]{width:100%}
  .value .maker-panel input[type=range]{accent-color:#333}
  .chroma .maker-panel input[type=range]{accent-color:var(--cobalt)}
  .range-labels{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;
    border-radius:10px;z-index:50;max-width:90vw;font-size:15px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
  .busy{position:fixed;inset:0;background:rgba(255,255,255,.82);z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px}
  .busy .bar{width:200px;height:10px;border-radius:2px;background:linear-gradient(90deg,#151515,#f2f2f2,#8d8f96,var(--cobalt));background-size:300% 100%;animation:slide 1.6s linear infinite}
  @keyframes slide{to{background-position:300% 0}}

  @media (max-width:860px){
    .masthead{grid-template-columns:1fr;gap:14px;padding-top:26px}
    .masthead .scale{flex-direction:row;justify-content:center}
    .masthead .scale.value-scale{order:2}
    .masthead .scale.chroma-scale{order:3}
    .chips i{width:16px;height:22px}
    .tri{grid-template-columns:1fr}
    .tri .orig{order:-1}
    .sheet{padding:22px 16px 18px}
  }
  @media (prefers-reduced-motion:reduce){
    .flip-inner{transition:none}
    .heart.pop svg,.busy .bar{animation:none}
  }
</style>
</head>
<body>

<header>
  <div class="masthead">
    <div class="scale value-scale" aria-hidden="true"><div class="chips" id="valueChips"></div><small>명도: 밝고 어두운 정도</small></div>
    <div class="title-wrap">
      <h1>명도·채도 변화 감상 갤러리</h1>
      <p>같은 그림도 밝기와 선명함이 바뀌면 느낌이 달라져요. 친구 작품을 눌러 어떤 느낌이 들었는지 확인해 보세요.</p>
    </div>
    <div class="scale chroma-scale" aria-hidden="true"><div class="chips" id="chromaChips"></div><small>채도: 색이 맑고 선명한 정도</small></div>
  </div>

  <div class="toolbar">
    <div class="me" role="group" aria-label="내 학번과 이름">
      <label>학번 <input id="meId" inputmode="numeric" maxlength="6" placeholder="10101" autocomplete="off"></label>
      <label>이름 <input id="meName" maxlength="20" placeholder="홍길동" autocomplete="off"></label>
      <button class="btn" id="meSave" type="button">확인</button>
      <span class="status" id="meStatus" aria-live="polite"></span>
    </div>
    <div class="actions">
      <input id="search" type="search" placeholder="이름·제목·학번 찾기" aria-label="작품 찾기">
      <select id="sort" aria-label="정렬">
        <option value="new">최신순</option>
        <option value="heart">하트 많은 순</option>
        <option value="id">학번순</option>
      </select>
      <button class="btn" id="refresh" type="button">새로고침</button>
      <button class="btn primary" id="openUpload" type="button">작품 올리기</button>
      <button class="btn" id="teacherBtn" type="button">교사</button>
    </div>
  </div>
</header>

<main>
  <p class="count" id="count"></p>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden></div>
</main>

<!-- 작품 자세히 보기 -->
<div class="modal" id="detail" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="dTitle">
    <button class="close" data-close aria-label="닫기">×</button>
    <header>
      <h2 id="dTitle"></h2>
      <p id="dWho"></p>
    </header>
    <div class="tri">
      <figure class="panel value">
        <figcaption><i></i>명도를 바꾼 작품</figcaption>
        <div class="flip" tabindex="0" role="button" aria-label="명도 변화 느낌 보기">
          <div class="flip-inner">
            <div class="face front"><img id="dValue" alt="명도를 바꾼 작품"></div>
            <div class="face back"><h4>명도를 바꾸었더니…</h4><p id="dValueFeeling"></p></div>
          </div>
        </div>
        <span class="hint">그림을 누르면 느낌을 볼 수 있어요</span>
      </figure>
      <figure class="panel orig">
        <figcaption><i></i>원작품</figcaption>
        <div class="flip" id="origFlip" tabindex="0" role="button" aria-label="작품 선정 의도 보기">
          <div class="flip-inner">
            <div class="face front"><img id="dOrig" alt="원작품"></div>
            <div class="face back"><h4>작품 선정 의도</h4><p id="dDesc"></p></div>
          </div>
        </div>
        <span class="hint" id="origHint">그림을 누르면 작품 선정 의도를 볼 수 있어요</span>
      </figure>
      <figure class="panel chroma">
        <figcaption><i></i>채도를 바꾼 작품</figcaption>
        <div class="flip" tabindex="0" role="button" aria-label="채도 변화 느낌 보기">
          <div class="flip-inner">
            <div class="face front"><img id="dChroma" alt="채도를 바꾼 작품"></div>
            <div class="face back"><h4>채도를 바꾸었더니…</h4><p id="dChromaFeeling"></p></div>
          </div>
        </div>
        <span class="hint">그림을 누르면 느낌을 볼 수 있어요</span>
      </figure>
    </div>
    <footer>
      <div id="dHeart"></div>
      <button class="btn danger" id="dDelete" type="button" hidden>이 작품 삭제</button>
    </footer>
  </div>
</div>

<!-- 작품 올리기 -->
<div class="modal" id="upload" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="uHead">
    <button class="close" data-close aria-label="닫기">×</button>
    <header>
      <h2 id="uHead">작품 올리기</h2>
      <p>가운데에 원작품, 왼쪽에 명도를 바꾼 작품, 오른쪽에 채도를 바꾼 작품을 올려 주세요.</p>
    </header>
    <div class="who-row">
      <label class="field">학번<input id="uId" inputmode="numeric" maxlength="6" placeholder="10101"></label>
      <label class="field">이름<input id="uName" maxlength="20" placeholder="홍길동"></label>
      <label class="field grow">작품 제목 (선택)<input id="uTitle" maxlength="40" placeholder="예: 비 오는 날의 골목"></label>
    </div>
    <div class="tri">
      <section class="panel slot value" data-slot="value">
        <figcaption class="panel-cap"><i></i>명도를 바꾼 작품</figcaption>
        <label class="drop"><input type="file" accept="image/*"><img alt="" hidden>
          <span class="ph"><b>사진 선택</b>밝기를 바꾼 그림</span></label>
        <div class="maker">
          <button class="btn make" type="button">원작품으로 직접 만들기</button>
          <div class="maker-panel" hidden>
            <input type="range" min="-80" max="80" value="0" step="1" aria-label="명도 조절">
            <div class="range-labels"><span>어둡게</span><span>밝게</span></div>
            <button class="btn use" type="button">이대로 사용하기</button>
          </div>
        </div>
        <label class="field">명도를 바꾸었더니 어떤 느낌이 들었나요?
          <textarea id="uValueFeeling" maxlength="500" placeholder="예: 전체가 어두워지니 밤처럼 조용하고 쓸쓸한 느낌이 들었다."></textarea></label>
      </section>

      <section class="panel slot orig" data-slot="orig">
        <figcaption class="panel-cap"><i></i>원작품</figcaption>
        <label class="drop"><input type="file" accept="image/*"><img alt="" hidden>
          <span class="ph"><b>사진 선택</b>선정한 작품</span></label>
        <label class="field">작품 선정 의도 (선택)
          <textarea id="uDesc" maxlength="300" placeholder="이 작품을 고른 이유를 짧게 적어 주세요."></textarea></label>
      </section>

      <section class="panel slot chroma" data-slot="chroma">
        <figcaption class="panel-cap"><i></i>채도를 바꾼 작품</figcaption>
        <label class="drop"><input type="file" accept="image/*"><img alt="" hidden>
          <span class="ph"><b>사진 선택</b>선명함을 바꾼 그림</span></label>
        <div class="maker">
          <button class="btn make" type="button">원작품으로 직접 만들기</button>
          <div class="maker-panel" hidden>
            <input type="range" min="-100" max="100" value="0" step="1" aria-label="채도 조절">
            <div class="range-labels"><span>탁하게</span><span>선명하게</span></div>
            <button class="btn use" type="button">이대로 사용하기</button>
          </div>
        </div>
        <label class="field">채도를 바꾸었더니 어떤 느낌이 들었나요?
          <textarea id="uChromaFeeling" maxlength="500" placeholder="예: 채도를 높이니 색이 톡톡 튀어서 신나고 활기찬 느낌이 들었다."></textarea></label>
      </section>
    </div>
    <footer>
      <span class="hint">같은 학번으로 다시 올리면 새 작품으로 바뀌어요. 받은 하트는 그대로 남아요.</span>
      <div style="display:flex;gap:8px">
        <button class="btn" data-close type="button">취소</button>
        <button class="btn primary" id="submitBtn" type="button">작품 올리기</button>
      </div>
    </footer>
  </div>
</div>

<div class="busy" id="busy" hidden><div class="bar"></div><div id="busyText"></div></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function(){
  const $ = s => document.querySelector(s);
  const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
  const S = {
    me: { id: '', name: '' }, arts: [], teacher: false, pw: '',
    up: { orig: null, value: null, chroma: null }, origSmall: null,
    current: null, busy: false, pending: {}
  };
  const HEART_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.4 7.9 3.6 4.5 7 4.5c2 0 3.6 1.1 5 3 1.4-1.9 3-3 5-3 3.4 0 5.6 3.4 4.3 6.8-1.8 4.6-9.3 9.2-9.3 9.2z"/></svg>';

  /* ---------- 공통 ---------- */
  // Apps Script 안에서 열리면 google.script.run, GitHub Pages에서 열리면 API_URL로 요청
  const IN_GAS = typeof google !== 'undefined' && google.script && google.script.run;
  function run(fn) {
    const args = Array.prototype.slice.call(arguments, 1);
    if (IN_GAS) {
      return new Promise((res, rej) => {
        google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn].apply(null, args);
      });
    }
    if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(API_URL)) {
      return Promise.reject(new Error('서버 주소가 설정되지 않았어요. 선생님께 알려 주세요. (index.html의 API_URL)'));
    }
    return fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },  // text/plain이어야 Apps Script가 받아 줘요
      body: JSON.stringify({ fn: fn, args: args })
    }).then(r => {
      if (!r.ok) throw new Error('서버에 연결하지 못했어요. 잠시 후 다시 시도해 주세요.');
      return r.json();
    }, () => { throw new Error('인터넷 연결을 확인하고 다시 시도해 주세요.'); })
      .then(d => { if (!d.ok) throw new Error(d.error); return d.result; });
  }
  function msg(e) { return String((e && e.message) || e || '문제가 생겼어요.').replace(/^Exception:\s*/, ''); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  let toastTimer;
  function toast(t) {
    const el = $('#toast'); el.textContent = t; el.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.hidden = true, 3200);
  }
  function setBusy(on, text) {
    S.busy = on; $('#busy').hidden = !on; $('#busyText').textContent = text || '';
  }
  function openModal(id) { $(id).hidden = false; document.body.classList.add('noscroll'); }
  function closeModal(id) {
    $(id).hidden = true;
    if ($('#detail').hidden && $('#upload').hidden) document.body.classList.remove('noscroll');
    if (id === '#detail') S.current = null;
  }

  /* ---------- 이미지 표시 (드라이브 공유가 막혀 있으면 서버에서 대신 불러옴) ---------- */
  const imgCache = {};
  function setImg(img, fid, w) {
    if (!fid) return;
    if (imgCache[fid]) { img.src = imgCache[fid]; return; }
    img.onerror = function () {
      img.onerror = null;
      run('getImageData', fid).then(d => { if (d) { imgCache[fid] = d; img.src = d; } }).catch(() => {});
    };
    img.src = 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(fid) + '&sz=w' + (w || 800);
  }

  /* ---------- 상단 색 띠 ---------- */
  (function chips() {
    let v = '', c = '';
    for (let i = 0; i < 9; i++) {
      const g = Math.round(20 + i * (235 / 8));
      v += '<i style="background:rgb(' + g + ',' + g + ',' + g + ')"></i>';
      c += '<i style="background:hsl(226,' + Math.round(i * 10.5) + '%,' + (52 - i * .6) + '%)"></i>';
    }
    $('#valueChips').innerHTML = v; $('#chromaChips').innerHTML = c;
  })();

  /* ---------- 내 학번·이름 ---------- */
  function loadMe() {
    try { const v = JSON.parse(localStorage.getItem('vcGalleryMe') || 'null'); if (v && v.id) S.me = v; } catch (e) {}
    $('#meId').value = S.me.id; $('#meName').value = S.me.name;
    $('#meStatus').textContent = S.me.id ? '반가워요, ' + S.me.name + '!' : '';
  }
  function setMe(id, name) {
    S.me = { id: id, name: name };
    try { localStorage.setItem('vcGalleryMe', JSON.stringify(S.me)); } catch (e) {}
    $('#meId').value = id; $('#meName').value = name;
    $('#meStatus').textContent = '반가워요, ' + name + '!';
  }
  $('#meSave').addEventListener('click', () => {
    const id = $('#meId').value.trim(), name = $('#meName').value.trim();
    if (!/^\d{3,6}$/.test(id)) { toast('학번은 숫자로 적어 주세요. (예: 10101)'); $('#meId').focus(); return; }
    if (!name) { toast('이름을 적어 주세요.'); $('#meName').focus(); return; }
    setMe(id, name); loadArts();
  });
  [$('#meId'), $('#meName')].forEach(el => el.addEventListener('keydown', e => { if (e.key === 'Enter') $('#meSave').click(); }));

  /* ---------- 갤러리 ---------- */
  function heartHTML(a, big) {
    return '<button type="button" class="heart' + (big ? ' big' : '') + (a.liked ? ' liked' : '') +
      '" data-heart="' + esc(a.id) + '" aria-pressed="' + a.liked + '" aria-label="하트 ' + a.hearts + '개">' +
      HEART_SVG + '<span>' + a.hearts + '</span></button>';
  }
  function cardHTML(a) {
    return '<article class="card" tabindex="0" data-id="' + esc(a.id) + '">' +
      '<div class="trip">' +
        '<div class="t side"><img data-fid="' + esc(a.value) + '" alt="명도를 바꾼 작품" loading="lazy"></div>' +
        '<div class="t"><img data-fid="' + esc(a.orig) + '" alt="원작품" loading="lazy"></div>' +
        '<div class="t side"><img data-fid="' + esc(a.chroma) + '" alt="채도를 바꾼 작품" loading="lazy"></div>' +
      '</div>' +
      '<div class="meta"><div><h3>' + esc(a.title || '제목 없음') + '</h3><p>' + esc(a.studentId) + ' ' + esc(a.name) + '</p></div>' +
      heartHTML(a, false) + '</div></article>';
  }
  function render() {
    const q = $('#search').value.trim();
    let list = S.arts.filter(a => !q || (a.name + ' ' + a.title + ' ' + a.studentId).indexOf(q) > -1);
    const sort = $('#sort').value;
    list.sort((a, b) => sort === 'heart' ? (b.hearts - a.hearts || b.time - a.time)
      : sort === 'id' ? a.studentId.localeCompare(b.studentId, 'ko', { numeric: true })
      : b.time - a.time);
    $('#grid').innerHTML = list.map(cardHTML).join('');
    $$('#grid img[data-fid]').forEach(img => setImg(img, img.dataset.fid, 500));
    $('#count').textContent = S.arts.length ? '작품 ' + S.arts.length + '점' + (q ? ' 중 ' + list.length + '점' : '') : '';
    const empty = $('#empty');
    if (!S.arts.length) {
      empty.innerHTML = '<strong>아직 걸린 작품이 없어요</strong>[작품 올리기]를 눌러 첫 작품을 걸어 보세요.';
      empty.hidden = false;
    } else if (!list.length) {
      empty.innerHTML = '<strong>찾는 작품이 없어요</strong>이름이나 학번을 다시 확인해 보세요.';
      empty.hidden = false;
    } else empty.hidden = true;
  }
  async function loadArts(silent) {
    if (!silent) $('#count').textContent = '작품을 불러오는 중…';
    try {
      S.arts = await run('getArtworks', S.me.id);
      render();
      if (S.current) {
        const a = S.arts.find(x => x.id === S.current);
        if (a) $('#dHeart').innerHTML = heartHTML(a, true); else closeModal('#detail');
      }
    } catch (e) { if (!silent) toast(msg(e)); }
  }
  $('#search').addEventListener('input', render);
  $('#sort').addEventListener('change', render);
  $('#refresh').addEventListener('click', () => loadArts());

  $('#grid').addEventListener('click', e => {
    const h = e.target.closest('[data-heart]');
    if (h) { e.stopPropagation(); toggleHeart(h.dataset.heart); return; }
    const card = e.target.closest('.card'); if (card) openDetail(card.dataset.id);
  });
  $('#grid').addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.classList.contains('card')) openDetail(e.target.dataset.id);
  });

  /* ---------- 하트 ---------- */
  function paintHeart(a) {
    $$('[data-heart="' + a.id + '"]').forEach(b => {
      b.classList.toggle('liked', a.liked);
      b.setAttribute('aria-pressed', a.liked);
      b.setAttribute('aria-label', '하트 ' + a.hearts + '개');
      b.querySelector('span').textContent = a.hearts;
      if (a.liked) { b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop'); }
    });
  }
  async function toggleHeart(id) {
    if (!S.me.id) { toast('하트를 누르려면 먼저 위쪽에 학번과 이름을 적고 [확인]을 눌러 주세요.'); closeModal('#detail'); $('#meId').focus(); return; }
    const a = S.arts.find(x => x.id === id); if (!a || S.pending[id]) return;
    if (a.studentId === S.me.id) { toast('내 작품에는 하트를 누를 수 없어요. 친구 작품에 눌러 주세요!'); return; }
    S.pending[id] = true;
    const before = { liked: a.liked, hearts: a.hearts };
    a.liked = !a.liked; a.hearts += a.liked ? 1 : -1; paintHeart(a);
    try {
      const r = await run('toggleHeart', id, S.me.id);
      a.liked = r.liked; a.hearts = r.hearts; paintHeart(a);
    } catch (e) {
      a.liked = before.liked; a.hearts = before.hearts; paintHeart(a); toast(msg(e));
    } finally { delete S.pending[id]; }
  }

  /* ---------- 자세히 보기 ---------- */
  function openDetail(id) {
    const a = S.arts.find(x => x.id === id); if (!a) return;
    S.current = id;
    $('#dTitle').textContent = a.title || '제목 없음';
    $('#dWho').textContent = a.studentId + ' ' + a.name;
    ['#dValue', '#dOrig', '#dChroma'].forEach(s => $(s).removeAttribute('src'));
    setImg($('#dValue'), a.value, 1200); setImg($('#dOrig'), a.orig, 1400); setImg($('#dChroma'), a.chroma, 1200);
    $('#dValueFeeling').textContent = a.valueFeeling;
    $('#dChromaFeeling').textContent = a.chromaFeeling;
    $('#dDesc').textContent = a.desc;
    const hasDesc = !!a.desc.trim();
    $('#origFlip').classList.toggle('static', !hasDesc);
    $('#origHint').hidden = !hasDesc;
    $$('#detail .flip').forEach(f => f.classList.remove('flipped'));
    $('#dHeart').innerHTML = heartHTML(a, true);
    $('#dDelete').hidden = !S.teacher;
    openModal('#detail');
    $('#detail .close').focus();
  }
  $$('#detail .flip').forEach(f => {
    const go = () => { if (!f.classList.contains('static')) f.classList.toggle('flipped'); };
    f.addEventListener('click', go);
    f.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
  });
  $('#dHeart').addEventListener('click', e => { const h = e.target.closest('[data-heart]'); if (h) toggleHeart(h.dataset.heart); });
  $('#dDelete').addEventListener('click', async () => {
    const a = S.arts.find(x => x.id === S.current); if (!a) return;
    if (!confirm(a.studentId + ' ' + a.name + ' 학생의 작품을 삭제할까요? 하트 기록도 함께 지워져요.')) return;
    setBusy(true, '작품을 삭제하는 중이에요…');
    try { await run('deleteArtwork', a.id, S.pw); closeModal('#detail'); toast('작품을 삭제했어요.'); await loadArts(true); }
    catch (e) { toast(msg(e)); } finally { setBusy(false); }
  });

  /* ---------- 교사 모드 ---------- */
  $('#teacherBtn').addEventListener('click', async () => {
    if (S.teacher) {
      S.teacher = false; S.pw = ''; $('#teacherBtn').textContent = '교사'; $('#teacherBtn').classList.remove('on');
      toast('교사 모드를 껐어요.'); return;
    }
    const pw = prompt('교사 비밀번호를 입력하세요.'); if (!pw) return;
    try {
      if (await run('checkTeacher', pw)) {
        S.teacher = true; S.pw = pw; $('#teacherBtn').textContent = '교사 모드 끄기'; $('#teacherBtn').classList.add('on');
        toast('교사 모드를 켰어요. 작품을 열면 삭제할 수 있어요.');
      } else toast('비밀번호가 맞지 않아요.');
    } catch (e) { toast(msg(e)); }
  });

  /* ---------- 작품 올리기 ---------- */
  function fileToCanvas(file, max) {
    return new Promise((res, rej) => {
      if (!file || !/^image\//.test(file.type)) return rej(new Error('이미지 파일만 올릴 수 있어요.'));
      const url = URL.createObjectURL(file); const img = new Image();
      img.onload = () => {
        const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        const c = document.createElement('canvas');
        c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
        const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
        x.drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c);
      };
      img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('이 사진을 열 수 없어요. JPG나 PNG 파일로 올려 주세요.')); };
      img.src = url;
    });
  }
  function scaled(src, max) {
    const s = Math.min(1, max / Math.max(src.width, src.height));
    const c = document.createElement('canvas'); c.width = Math.round(src.width * s); c.height = Math.round(src.height * s);
    c.getContext('2d').drawImage(src, 0, 0, c.width, c.height); return c;
  }
  // 명도: -값이면 검정 쪽으로, +값이면 흰색 쪽으로 / 채도: 회색(무채색)과 원래 색 사이를 조절
  function adjust(src, type, amt) {
    const c = document.createElement('canvas'); c.width = src.width; c.height = src.height;
    const x = c.getContext('2d'); x.drawImage(src, 0, 0);
    const d = x.getImageData(0, 0, c.width, c.height), p = d.data, k = amt / 100;
    for (let i = 0; i < p.length; i += 4) {
      if (type === 'value') {
        for (let j = 0; j < 3; j++) { const v = p[i + j]; p[i + j] = k >= 0 ? v + (255 - v) * k : v * (1 + k); }
      } else {
        const l = 0.299 * p[i] + 0.587 * p[i + 1] + 0.114 * p[i + 2], s = 1 + k;
        for (let j = 0; j < 3; j++) p[i + j] = Math.max(0, Math.min(255, l + (p[i + j] - l) * s));
      }
    }
    x.putImageData(d, 0, 0); return c;
  }
  function showInSlot(slot, canvas) {
    const box = $('.slot[data-slot="' + slot + '"] .drop');
    const img = box.querySelector('img');
    img.src = canvas.toDataURL('image/jpeg', 0.82); img.hidden = false; box.classList.add('filled');
  }
  function clearSlot(slot) {
    S.up[slot] = null;
    const box = $('.slot[data-slot="' + slot + '"] .drop');
    box.querySelector('img').hidden = true; box.querySelector('img').removeAttribute('src');
    box.querySelector('input').value = ''; box.classList.remove('filled');
  }
  async function takeFile(slot, file) {
    try {
      const c = await fileToCanvas(file, 1400);
      S.up[slot] = c; showInSlot(slot, c);
      if (slot === 'orig') S.origSmall = scaled(c, 520);
      const mp = $('.slot[data-slot="' + slot + '"] .maker-panel'); if (mp) mp.hidden = true;
    } catch (e) { toast(msg(e)); }
  }
  $$('.slot').forEach(slotEl => {
    const slot = slotEl.dataset.slot, drop = slotEl.querySelector('.drop'), input = drop.querySelector('input');
    input.addEventListener('change', () => input.files[0] && takeFile(slot, input.files[0]));
    drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('over'));
    drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); const f = e.dataTransfer.files[0]; if (f) takeFile(slot, f); });

    const make = slotEl.querySelector('.make'); if (!make) return;
    const panel = slotEl.querySelector('.maker-panel'), range = panel.querySelector('input'), use = panel.querySelector('.use');
    let raf = 0;
    make.addEventListener('click', () => {
      if (!S.up.orig) { toast('먼저 가운데에 원작품을 올려 주세요.'); return; }
      panel.hidden = !panel.hidden;
      if (!panel.hidden) { range.value = 0; showInSlot(slot, S.origSmall); }
    });
    range.addEventListener('input', () => {
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(() => showInSlot(slot, adjust(S.origSmall, slot, +range.value)));
    });
    use.addEventListener('click', () => {
      if (+range.value === 0) { toast('막대를 움직여 ' + (slot === 'value' ? '밝기' : '선명함') + '를 바꿔 보세요.'); return; }
      const full = adjust(S.up.orig, slot, +range.value);
      S.up[slot] = full; showInSlot(slot, full); panel.hidden = true;
      toast(slot === 'value' ? '명도를 바꾼 작품을 만들었어요.' : '채도를 바꾼 작품을 만들었어요.');
    });
  });

  function resetUpload() {
    ['orig', 'value', 'chroma'].forEach(clearSlot); S.origSmall = null;
    ['#uTitle', '#uDesc', '#uValueFeeling', '#uChromaFeeling'].forEach(s => $(s).value = '');
    $$('#upload .maker-panel').forEach(p => p.hidden = true);
  }
  $('#openUpload').addEventListener('click', () => {
    $('#uId').value = S.me.id; $('#uName').value = S.me.name;
    openModal('#upload'); (S.me.id ? $('#uTitle') : $('#uId')).focus();
  });

  async function submit(overwrite) {
    const id = $('#uId').value.trim(), name = $('#uName').value.trim();
    const vf = $('#uValueFeeling').value.trim(), cf = $('#uChromaFeeling').value.trim();
    if (!/^\d{3,6}$/.test(id)) { toast('학번은 숫자로 적어 주세요. (예: 10101)'); $('#uId').focus(); return; }
    if (!name) { toast('이름을 적어 주세요.'); $('#uName').focus(); return; }
    if (!S.up.orig) { toast('가운데에 원작품을 올려 주세요.'); return; }
    if (!S.up.value) { toast('왼쪽에 명도를 바꾼 작품을 올려 주세요.'); return; }
    if (!S.up.chroma) { toast('오른쪽에 채도를 바꾼 작품을 올려 주세요.'); return; }
    if (!vf) { toast('명도를 바꾸었을 때의 느낌을 적어 주세요.'); $('#uValueFeeling').focus(); return; }
    if (!cf) { toast('채도를 바꾸었을 때의 느낌을 적어 주세요.'); $('#uChromaFeeling').focus(); return; }

    setBusy(true, '작품을 올리는 중이에요. 창을 닫지 말고 잠시만 기다려 주세요.');
    try {
      const r = await run('submitArtwork', {
        studentId: id, name: name, title: $('#uTitle').value.trim(), desc: $('#uDesc').value.trim(),
        valueFeeling: vf, chromaFeeling: cf, overwrite: !!overwrite,
        orig: S.up.orig.toDataURL('image/jpeg', 0.86),
        value: S.up.value.toDataURL('image/jpeg', 0.86),
        chroma: S.up.chroma.toDataURL('image/jpeg', 0.86)
      });
      if (r.exists) {
        setBusy(false);
        if (confirm('이 학번으로 이미 올린 작품' + (r.oldTitle ? ' "' + r.oldTitle + '"' : '') +
          '이 있어요. 새 작품으로 바꿀까요?\n(받은 하트는 그대로 남아요)')) return submit(true);
        return;
      }
      setMe(id, name);
      closeModal('#upload'); resetUpload();
      toast(r.updated ? '작품을 새 작품으로 바꿨어요.' : '작품을 올렸어요! 친구들의 작품도 감상해 보세요.');
      $('#sort').value = 'new'; $('#search').value = '';
      await loadArts(true);
    } catch (e) { toast(msg(e)); }
    finally { setBusy(false); }
  }
  $('#submitBtn').addEventListener('click', () => submit(false));

  /* ---------- 닫기 ---------- */
  $$('[data-close]').forEach(b => b.addEventListener('click', () => closeModal('#' + b.closest('.modal').id)));
  $('#detail').addEventListener('click', e => { if (e.target.id === 'detail') closeModal('#detail'); });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape' || S.busy) return;
    if (!$('#detail').hidden) closeModal('#detail');
    else if (!$('#upload').hidden) closeModal('#upload');
  });

  /* ---------- 시작 ---------- */
  loadMe();
  loadArts();
  // 30초마다 하트 수를 새로 가져옴
  setInterval(() => { if (!document.hidden && !S.busy && $('#upload').hidden) loadArts(true); }, 30000);
})();
</script>
</body>
</html>
